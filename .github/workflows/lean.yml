name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
      - name: Check Erlang function manifest
        working-directory: Lean
        run: |
          lake env lean --run ExportModules.lean > "$RUNNER_TEMP/modules.json"
          diff -u modules.json "$RUNNER_TEMP/modules.json"
